name: AppDrop
options:
  bundleIdPrefix: com.appdrop
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  SharedKit:
    path: SharedKit
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The local identity is applied explicitly after building. The distribution
    # app contains no provisioning profile and no sandbox entitlements.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  AppDrop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AppDrop
      - path: AppDropHelper/Resources/com.appdrop.nosandbox.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: SharedKit
      - target: AppDropHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appdrop.nosandbox
        PRODUCT_NAME: AppDrop No Sandbox
        CODE_SIGN_ENTITLEMENTS: AppDrop/AppDrop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
    info:
      path: AppDrop/Info.plist
      properties:
        CFBundleDisplayName: AppDrop No Sandbox
        CFBundleName: AppDrop No Sandbox
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        CFBundleLocalizations:
          - en
          - zh-Hans
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright (C) 2026 我是艾文喵"
        LSMinimumSystemVersion: "14.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Wishdrop Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.appdrop.wishdrop
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.appdrop.wishdrop
            UTTypeDescription: Wishdrop Preset
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - wishdrop
  AppDropHelper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AppDropHelper
        excludes:
          - "Resources/com.appdrop.nosandbox.helper.plist"
      - path: AppDropHelper/Resources/com.appdrop.nosandbox.helper.plist
        buildPhase: none
      - path: AppDrop/Resources/Assets.xcassets
    dependencies:
      - package: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appdrop.nosandbox.helper
        PRODUCT_NAME: AppDropHelper
        CODE_SIGN_ENTITLEMENTS: AppDropHelper/AppDropHelper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The helper is embedded inside AppDrop.app; it must not be archived as
        # a separate installable product, otherwise the archive has two products
        # and Xcode omits ApplicationProperties (Organizer then shows no version
        # and cannot export the app).
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
    info:
      path: AppDropHelper/Info.plist
      properties:
        CFBundleDisplayName: AppDrop No Sandbox Helper
        CFBundleName: AppDropHelper
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        CFBundleLocalizations:
          - en
          - zh-Hans
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright (C) 2026 我是艾文喵"
schemes:
  AppDrop:
    build:
      targets:
        AppDrop: all
        AppDropHelper: all
    run:
      config: Debug

